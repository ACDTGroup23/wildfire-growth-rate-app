<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산불 후 파종 길잡이</title>
<meta name="description" content="After a wildfire, estimate fire severity, ash load, soil salinity and pH, see which barley-family crops will grow, and how much better they grow after liming or adding sulfur. Prototype by USS Capstone Group 27.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파종 길잡이">
<link rel="preload" href="fonts/Pretendard-SemiBold.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Pretendard-Bold.subset.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var m=localStorage.getItem("pfg-theme");if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m);}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <header class="nav" id="nav">
    <button type="button" class="nav-back" id="backBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr" id="backLabel">뒤로 가기</span></button>
    <div class="nav-actions">
      <button type="button" class="nav-text" id="installBtn" hidden>설치하기</button>
      <button type="button" class="nav-icon" id="themeBtn" aria-label="화면 모드"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg></button>
      <button type="button" class="nav-text" id="langBtn" lang="en">EN</button>
    </div>
    <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
  </header>
  <main class="screen" id="screen"></main>
  <div class="cta" id="cta" hidden>
    <div class="cta-in"><button type="button" class="btn primary" id="ctaBtn"></button></div>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-dim" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions">
      <button type="button" class="btn secondary" id="sheetClose" data-close>닫기</button>
      <button type="button" class="btn primary" id="sheetCompare">그림으로 비교하기</button>
    </div>
  </section>
</div>
<p class="toast" id="toast" role="status" hidden></p>
<noscript><p style="padding:24px">이 앱은 JavaScript를 켜야 쓸 수 있어요. This app needs JavaScript.</p></noscript>

<script src="assets/data.js"></script>
<script src="assets/model.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
